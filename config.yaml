# ---- Best Braai social media agent settings ----
brand:
  name: "Best Braai"
  handle: ""                               # Instagram handle on images (empty = not shown)
  cta: "Charcoal & briquettes at Best Braai 🔥"
  story_cta: "Charcoal & Briquettes"
  hashtags: ["#BestBraai", "#Charcoal", "#Briquettes"]

schedule:
  start_date: 2026-10-22    # first posting day; then every N days after that
  every_n_days: 2

meta:
  fb_page_id: "1019998334781471"   # Best Braai Facebook Page (from Meta Business Suite)
  business_id: "531195883973157"   # Meta Business portfolio (for reference)
  ig_user_id: ""                   # filled in during setup (or set the IG_USER_ID secret)

platforms:
  instagram: true
  facebook: true

# Optional: where the images are publicly reachable. Leave empty when running on
# GitHub Actions with a public repo (raw.githubusercontent.com is used automatically).
media_base_url: ""
